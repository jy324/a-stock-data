[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astock-data"
version = "0.2.0"
description = "A-share data facade and provider contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "a-stock-data contributors" }]
dependencies = []

[project.optional-dependencies]
tdx = ["mootdx>=0.11"]
reports = ["pandas>=2.0", "lxml>=4.9"]
all = ["mootdx>=0.11", "pandas>=2.0", "lxml>=4.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = [
    "network: tests that call live upstream data providers",
]
